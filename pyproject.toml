[project]
name = "neuronvis"
version = "0.2.3a"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.13.7"
authors = [
    { name = "Paul B. Manis", email = "pbmanis@med.unc.edu" },
    { name = "Luke Campagnola", email = "lukecampagnola@gmail.com" }
]


dependencies = [
    "brotli==1.1.0",
    "cryptography==41.0.5",
    "cv>=1.0.0",
    "cython>=3.0.4",
    "importlib-metadata==1.6.0",
    "ipaddr>=2.2.0",
    "keyring>=21.2.1",
    "lmfit>=1.3.0",
    "lockfile>=0.12.2",
    "lxml>=6.0.2",
    "matplotlib>=3.8.0",
    "mock>=4.0.2",
    "mypy-extensions>=0.4.3",
    "neuron>=9.0",
    "numpy>=2.3.5",
    "pyopengl>=3.1.5",
    "pyopenssl>=19.1.0",
    "pyqt6>=6.10.1",
    "pyqt6-sip>=13.10.3",
    "pyqtgraph>=0.13.0",
    "scipy>=1.16.3",
    "seaborn>=0.13.0",
    "simplejson>=3.17.0",
    "vispy>=0.15.2",
    "pylibrary",
]

[build-system]
requires = ["setuptools>=70", "hatchling", "wheel"]
build-backend = "hatchling.build" #"setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["neuronvis*"] # Include your main package

[tool.uv.sources]
pylibrary = { git = "https://github.com/pbmanis/pylibrary" }

[project.scripts]
hocRender='neuronvis.hocRender:main'
swc_to_hoc='neuronvis.swc_to_hoc:main'
hocViewer='neuronvis.viewer:main'


[project.gui-scripts]


